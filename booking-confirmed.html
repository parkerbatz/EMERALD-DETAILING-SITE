<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#050606"><title>Booking Received — Emerald Detailing Co.</title><style>:root{--green:#00d94f;--black:#050606;--panel:#0b0f0c;--line:#1e2922;--muted:#9da8a1;--white:#f4f7f5}*{box-sizing:border-box}body{margin:0;background:var(--black);color:var(--white);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",Inter,system-ui,sans-serif}.wrap{width:min(620px,100%);margin:auto;padding:24px 18px 50px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:70px}.logo{width:86px;height:38px;background:url("assets/emerald-logo.svg") center/contain no-repeat}.back{color:#b9c2bc;text-decoration:none;font-size:12px;font-weight:800;border:1px solid #344039;border-radius:8px;padding:11px 14px}.card{background:linear-gradient(180deg,#101511,#080a09);border:1px solid var(--line);border-radius:16px;padding:42px 26px;text-align:center}.check{width:70px;height:70px;border-radius:50%;border:1px solid var(--green);display:grid;place-items:center;color:var(--green);font-size:32px;margin:0 auto 22px}.eyebrow{color:var(--green);font-size:10px;letter-spacing:.2em;font-weight:900;text-transform:uppercase}.title{font-size:clamp(34px,8vw,52px);line-height:.95;letter-spacing:-.045em;text-transform:uppercase;margin:10px 0 14px}.sub{color:var(--muted);font-size:14px;line-height:1.65;margin:0 auto;max-width:470px}.details{margin:26px 0;border:1px solid #1c3022;background:rgba(0,217,79,.04);border-radius:10px;padding:15px;text-align:left}.details div{display:flex;justify-content:space-between;gap:15px;padding:7px 0;font-size:12px}.details span:first-child{color:#77837b}.details span:last-child{text-align:right;font-weight:800}.btn{display:block;background:var(--green);border:1px solid var(--green);color:#031007;border-radius:8px;padding:14px 18px;font-weight:900;font-size:12px;text-decoration:none}.note{color:#77837b;font-size:10px;line-height:1.5;margin-top:16px}@media(max-width:520px){.wrap{padding:14px 12px 34px}.top{margin-bottom:42px}.logo{width:78px;height:34px}.back{font-size:10px;padding:10px 12px}.card{padding:32px 17px}.title{font-size:clamp(31px,11vw,43px)}.sub{font-size:13px}.details{padding:12px}.details div{font-size:11px}}
</style></head><body><div class="wrap"><header class="top"><a class="logo" href="./" aria-label="Emerald Detailing Co."></a><a class="back" href="./">BACK TO SITE</a></header><main class="card"><div class="check">✓</div><div class="eyebrow">Emerald Detailing Co.</div><h1 class="title">Request <span style="color:var(--green)">received.</span></h1><p class="sub">Your booking request has been sent successfully. We'll contact you to confirm your appointment.</p><div class="details" id="details"></div><a class="btn" href="./">BACK TO SITE</a><p class="note">Your appointment is not confirmed until Emerald Detailing Co. reviews and confirms the request.</p></main></div><script>const p=new URLSearchParams(location.search);const service=p.get('service'),date=p.get('date'),time=p.get('time');if(service||date||time){document.getElementById('details').innerHTML=`${service?`<div><span>Service</span><span>${service}</span></div>`:''}${date?`<div><span>Date</span><span>${date}</span></div>`:''}${time?`<div><span>Time</span><span>${time}</span></div>`:''}`}else{document.getElementById('details').style.display='none'}</script></body></html>
