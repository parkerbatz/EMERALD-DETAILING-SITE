<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#050606"><meta name="robots" content="noindex,nofollow"><title>Emerald Admin — Bookings</title><style>
:root{--g:#00d94f;--b:#050606;--p:#0b0f0c;--p2:#101611;--l:#1e2922;--m:#8f9b93;--w:#f4f7f5;--red:#ff7474;--amber:#f3ce67}*{box-sizing:border-box}html{background:var(--b)}body{margin:0;background:radial-gradient(circle at top,#0d1710 0,#050606 38%);color:var(--w);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}.wrap{width:min(1180px,100%);margin:auto;padding:26px 18px 60px}.hidden{display:none!important}.top{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:32px}.brand{display:flex;align-items:center;gap:12px}.logo{width:86px;height:38px;background:url("assets/emerald-logo.svg") center/contain no-repeat}.ey{font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--g);font-weight:900}.title{margin:6px 0 0;font-size:clamp(34px,6vw,52px);line-height:.9;text-transform:uppercase;letter-spacing:-.045em}.title span{color:var(--g)}.btn{border:1px solid #303c34;background:#090d0a;color:var(--w);border-radius:8px;padding:11px 13px;font-size:10px;font-weight:900;letter-spacing:.04em;cursor:pointer}.btn.primary{background:var(--g);border-color:var(--g);color:#031007}.btn.danger{color:#ffb2b2;border-color:#5b2929}.login{width:min(440px,100%);margin:10vh auto;background:linear-gradient(180deg,#101611,#080a09);border:1px solid var(--l);border-radius:15px;padding:25px}.login h1{margin:6px 0;font-size:28px;text-transform:uppercase}.login p{color:var(--m);font-size:12px;line-height:1.55}.field{margin-top:15px}.field label{display:block;color:#758078;font-size:9px;text-transform:uppercase;letter-spacing:.1em;font-weight:900;margin-bottom:6px}.input,.select{width:100%;background:#080c09;border:1px solid #29352e;color:var(--w);border-radius:8px;padding:12px;font:inherit;font-size:14px;outline:none}.input:focus,.select:focus{border-color:var(--g)}.login .btn{width:100%;margin-top:14px}.error{color:#ffaaaa;font-size:11px;margin-top:10px;line-height:1.4}.toolbar{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:15px}.filters{display:flex;gap:8px;flex-wrap:wrap}.filters .input,.filters .select{width:auto;min-width:145px;font-size:11px;padding:10px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-bottom:15px}.stat{background:rgba(10,14,11,.92);border:1px solid var(--l);border-radius:11px;padding:14px}.stat small{display:block;color:#758078;font-size:8px;letter-spacing:.1em;text-transform:uppercase;font-weight:900}.stat strong{display:block;margin-top:6px;font-size:23px}.stat.pending strong{color:var(--amber)}.panel{background:linear-gradient(180deg,#101611,#080a09);border:1px solid var(--l);border-radius:14px;padding:17px}.panel-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}.booking{background:#090d0a;border:1px solid var(--l);border-radius:11px;padding:16px;margin-top:9px}.booking.pending{border-color:#4d4426}.headrow{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}.customer{font-size:16px;font-weight:900}.service{margin-top:3px;color:var(--g);font-size:11px;font-weight:900;text-transform:uppercase}.badge{display:inline-flex;border:1px solid #36423a;border-radius:999px;padding:5px 8px;font-size:8px;font-weight:900;text-transform:uppercase}.badge.pending{color:var(--amber);border-color:#5d5028}.badge.confirmed{color:#7fffa8;border-color:#245e38}.badge.completed{color:#a9b7ae}.badge.cancelled{color:#ff9d9d;border-color:#5a2929}.details{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin:14px 0;padding:12px 0;border-top:1px solid #18211c;border-bottom:1px solid #18211c}.detail small{display:block;color:#657169;font-size:8px;text-transform:uppercase;letter-spacing:.08em;font-weight:900}.detail div{margin-top:4px;font-size:11px;font-weight:750;line-height:1.35}.notes{background:#080c09;border:1px solid #17221b;border-radius:8px;padding:10px;color:#b6c0b9;font-size:11px;line-height:1.5;margin-bottom:11px}.actions{display:flex;gap:7px;flex-wrap:wrap}.empty{text-align:center;color:var(--m);padding:38px 15px;font-size:12px}.foot{text-align:center;color:#58635c;font-size:9px;margin-top:22px}@media(max-width:700px){.wrap{padding:20px 13px 45px}.logo{width:68px}.stats{grid-template-columns:1fr 1fr}.details{grid-template-columns:1fr 1fr}.filters{width:100%}.filters .input,.filters .select{flex:1;min-width:0}.headrow{display:block}.badge{margin-top:10px}}@media(max-width:430px){.top{align-items:flex-start}.stats{gap:6px}.stat{padding:11px}.stat strong{font-size:20px}}
</style></head><body>
<div class="wrap"><div id="login" class="login"><div class="ey">Emerald Detailing Co.</div><h1>Admin <span style="color:var(--g)">Bookings.</span></h1><p>Private booking management. Enter the admin key configured for your Emerald Worker.</p><div class="field"><label for="token">Admin key</label><input class="input" id="token" type="password" autocomplete="current-password" placeholder="Admin key"></div><button class="btn primary" id="loginBtn">ACCESS BOOKINGS</button><div id="loginError" class="error hidden"></div></div>
<div id="app" class="hidden"><header class="top"><div class="brand"><div class="logo"></div><div><div class="ey">Private dashboard</div><div class="title">Bookings<span>.</span></div></div></div><button class="btn" id="logout">LOG OUT</button></header>
<div class="toolbar"><div class="filters"><select class="select" id="status"><option value="">All statuses</option><option value="pending">Pending</option><option value="confirmed">Confirmed</option><option value="completed">Completed</option><option value="cancelled">Cancelled</option></select><input class="input" id="date" type="date"><button class="btn" id="clear">CLEAR</button></div><button class="btn primary" id="refresh">REFRESH</button></div>
<section class="stats"><div class="stat pending"><small>Pending</small><strong id="pendingCount">0</strong></div><div class="stat"><small>Confirmed</small><strong id="confirmedCount">0</strong></div><div class="stat"><small>Completed</small><strong id="completedCount">0</strong></div><div class="stat"><small>Visible</small><strong id="totalCount">0</strong></div></section>
<section class="panel"><div class="panel-head"><div class="ey">Customer schedule</div></div><div id="list"><div class="empty">Loading bookings…</div></div></section><div class="foot">Emerald Detailing Co. · Private admin area</div></div></div>
<script>
let token=sessionStorage.getItem('emerald_admin_key')||'';const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\\':'&#92;','"':'&quot;'}[c]));
function headers(){return {Authorization:'Bearer '+token}}function prettyDate(v){return new Date(v+'T12:00:00').toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric',year:'numeric'})}function prettyTime(v){return new Date('2000-01-01T'+v+':00').toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'})}
function showApp(){ $('login').classList.add('hidden');$('app').classList.remove('hidden') }function showLogin(msg=''){ $('app').classList.add('hidden');$('login').classList.remove('hidden');if(msg){$('loginError').textContent=msg;$('loginError').classList.remove('hidden')} }
async function fetchBookings(){const p=new URLSearchParams();const s=$('status').value,d=$('date').value;if(s)p.set('status',s);if(d)p.set('date',d);const r=await fetch('/api/admin/bookings?'+p.toString(),{headers:headers(),cache:'no-store'});const data=await r.json();if(r.status===401)throw new Error('Your admin key was rejected.');if(!r.ok)throw new Error(data.error||'Could not load bookings.');return data.bookings||[]}
async function load(){if(!token)return; $('list').innerHTML='<div class="empty">Loading bookings…</div>';try{render(await fetchBookings())}catch(e){showLogin(e.message)}}
function render(bs){const c={pending:0,confirmed:0,completed:0,cancelled:0};bs.forEach(b=>c[b.status]++);$('pendingCount').textContent=c.pending;$('confirmedCount').textContent=c.confirmed;$('completedCount').textContent=c.completed;$('totalCount').textContent=bs.length;if(!bs.length){$('list').innerHTML='<div class="empty">No bookings match these filters.</div>';return}$('list').innerHTML=bs.map(b=>`<article class="booking ${esc(b.status)}"><div class="headrow"><div><div class="customer">${esc(b.name)}</div><div class="service">${esc(b.service)}</div></div><span class="badge ${esc(b.status)}">${esc(b.status)}</span></div><div class="details"><div class="detail"><small>Date</small><div>${esc(prettyDate(b.service_date))}</div></div><div class="detail"><small>Time</small><div>${esc(prettyTime(b.start_time))}–${esc(prettyTime(b.end_time))}</div></div><div class="detail"><small>Vehicle</small><div>${esc(b.vehicle)}</div></div><div class="detail"><small>Price</small><div>$${esc(b.price)}</div></div><div class="detail"><small>Phone</small><div><a href="tel:${esc(b.phone)}" style="color:var(--w)">${esc(b.phone)}</a></div></div><div class="detail"><small>Type</small><div>${b.vehicle_type==='car'?'Car':'SUV / Truck'}</div></div><div class="detail"><small>Request ID</small><div>${esc(b.id.slice(0,8))}</div></div><div class="detail"><small>Received</small><div>${esc(b.created_at)}</div></div></div>${b.notes?`<div class="notes"><strong>Notes:</strong> ${esc(b.notes)}</div>`:''}<div class="actions">${b.status!=='confirmed'&&b.status!=='completed'?'<button class="btn primary" data-status="confirmed">CONFIRM</button>':''}${b.status!=='completed'&&b.status!=='cancelled'?'<button class="btn" data-status="completed">MARK COMPLETED</button>':''}${b.status!=='cancelled'?'<button class="btn danger" data-status="cancelled">CANCEL</button>':''}${b.status!=='pending'?'<button class="btn" data-status="pending">SET PENDING</button>':''}</div></article>`).join('');document.querySelectorAll('[data-status]').forEach(btn=>btn.onclick=async()=>{const card=btn.closest('.booking');const id=card.dataset.id||bs.find(x=>card.innerHTML.includes(x.id.slice(0,8)))?.id;if(!id)return;btn.disabled=true;try{const r=await fetch('/api/admin/bookings?id='+encodeURIComponent(id),{method:'PATCH',headers:{...headers(),'Content-Type':'application/json'},body:JSON.stringify({status:btn.dataset.status})});const d=await r.json();if(!r.ok)throw new Error(d.error||'Update failed.');await load()}catch(e){alert(e.message);btn.disabled=false}});document.querySelectorAll('.booking').forEach((card,i)=>card.dataset.id=bs[i].id)}
$('loginBtn').onclick=async()=>{token=$('token').value.trim();if(!token)return;sessionStorage.setItem('emerald_admin_key',token);try{showApp();await load()}catch(e){showLogin(e.message)}};$('token').addEventListener('keydown',e=>{if(e.key==='Enter')$('loginBtn').click()});$('refresh').onclick=load;$('status').onchange=load;$('date').onchange=load;$('clear').onclick=()=>{$('status').value='';$('date').value='';load()};$('logout').onclick=()=>{sessionStorage.removeItem('emerald_admin_key');token='';showLogin()};if(token){showApp();load()}
</script></body></html>
