<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#050606"><title>Emerald Admin — Bookings</title><style>
:root{--g:#00d94f;--b:#050606;--p:#0b0f0c;--l:#1e2922;--m:#9da8a1;--w:#f4f7f5}*{box-sizing:border-box}body{margin:0;background:var(--b);color:var(--w);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Inter,system-ui,sans-serif}.wrap{max-width:1100px;margin:auto;padding:25px 18px 60px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px}.logo{width:100px;height:38px;background:url("assets/emerald-logo.svg") center/contain no-repeat}.back{color:#b9c2bc;text-decoration:none;border:1px solid #344039;border-radius:8px;padding:10px 13px;font-size:11px;font-weight:900}.ey{color:var(--g);font-size:10px;letter-spacing:.2em;font-weight:900;text-transform:uppercase}.head{display:flex;justify-content:space-between;gap:15px;align-items:end;margin-bottom:22px}.head h1{font-size:clamp(34px,6vw,55px);line-height:.95;margin:8px 0 0;text-transform:uppercase;letter-spacing:-.04em}.controls{display:flex;gap:9px;flex-wrap:wrap}.input,.btn{background:#090c0a;border:1px solid #28332c;color:var(--w);border-radius:8px;padding:12px;font:inherit;font-size:12px}.btn{cursor:pointer;font-weight:900}.btn.primary{background:var(--g);color:#031007;border-color:var(--g)}.login,.panel{background:linear-gradient(180deg,#101511,#080a09);border:1px solid var(--l);border-radius:14px;padding:22px}.login{max-width:480px}.login h2{margin:0 0 7px;text-transform:uppercase}.login p,.muted{color:var(--m);font-size:12px;line-height:1.5}.login form{display:flex;gap:9px}.login input{flex:1}.hidden{display:none}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:18px 0}.stat{border:1px solid var(--l);border-radius:10px;padding:16px;background:#090c0a}.stat b{display:block;font-size:24px}.stat span{color:#77837b;font-size:10px;text-transform:uppercase;font-weight:900}.booking{border:1px solid var(--l);border-radius:11px;padding:17px;background:#090c0a;margin-top:10px}.row{display:grid;grid-template-columns:1fr auto;gap:15px;align-items:start}.booking h3{margin:0 0 6px;font-size:15px;text-transform:uppercase}.booking p{margin:4px 0;color:#aeb8b1;font-size:12px;line-height:1.5}.meta{color:#77837b!important}.actions{display:flex;gap:7px;flex-wrap:wrap}.status{display:inline-block;padding:5px 7px;border-radius:5px;font-size:9px;font-weight:900;text-transform:uppercase;border:1px solid #344039}.pending{color:#f3d27b}.confirmed{color:var(--g)}.cancelled{color:#ff9a9a}.completed{color:#9fb8a7}.error{color:#ff9a9a;font-size:11px;margin-top:10px}@media(max-width:700px){.head{display:block}.controls{margin-top:15px}.cards{grid-template-columns:1fr 1fr}.row{grid-template-columns:1fr}.login form{display:block}.login input,.login button{width:100%;margin-bottom:8px}}@media(max-width:430px){.cards{grid-template-columns:1fr 1fr}}
</style></head><body><div class="wrap"><header class="top"><a class="logo" href="./" aria-label="Emerald Detailing Co."></a><a class="back" href="./">SITE</a></header><div id="login" class="login"><div class="ey">Private dashboard</div><h2>Emerald Bookings</h2><p>Enter your admin access token. This token is kept in this browser session and is never displayed in the dashboard.</p><form id="loginForm"><input class="input" id="token" type="password" autocomplete="current-password" placeholder="Admin token" required><button class="btn primary">ACCESS</button></form><div id="loginError" class="error"></div></div><main id="app" class="hidden"><div class="head"><div><div class="ey">Emerald Detailing Co.</div><h1>Bookings.</h1></div><div class="controls"><input class="input" id="date" type="date"><button class="btn" id="refresh">REFRESH</button><button class="btn" id="logout">LOG OUT</button></div></div><div class="cards"><div class="stat"><b id="total">0</b><span>Visible</span></div><div class="stat"><b id="pending">0</b><span>Pending</span></div><div class="stat"><b id="confirmed">0</b><span>Confirmed</span></div><div class="stat"><b id="today">0</b><span>Today</span></div></div><div class="panel"><div class="ey">Schedule</div><p class="muted" id="empty">Loading bookings…</p><div id="list"></div></div></main></div><script>
let token=sessionStorage.getItem('emerald_admin_token')||'';const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\\':'&#92;','"':'&quot;'}[c]));
$('date').value=new Date().toISOString().slice(0,10);
function authHeaders(){return {Authorization:`Bearer ${token}`,'Content-Type':'application/json'}}
async function load(){if(!token)return;const date=$('date').value;try{const r=await fetch(`/api/admin${date?`?date=${encodeURIComponent(date)}`:''}`,{headers:authHeaders()});const d=await r.json();if(!r.ok)throw new Error(d.error||'Access denied');render(d.bookings||[])}catch(e){sessionStorage.removeItem('emerald_admin_token');token='';$('app').classList.add('hidden');$('login').classList.remove('hidden');$('loginError').textContent=e.message;$('loginError').style.display='block'}}
function render(bs){$('list').innerHTML='';$('empty').style.display=bs.length?'none':'block';$('empty').textContent='No bookings for this date.';$('total').textContent=bs.length;$('pending').textContent=bs.filter(x=>x.status==='pending').length;$('confirmed').textContent=bs.filter(x=>x.status==='confirmed').length;$('today').textContent=bs.filter(x=>x.service_date==new Date().toISOString().slice(0,10)).length;bs.forEach(b=>{const el=document.createElement('article');el.className='booking';el.innerHTML=`<div class="row"><div><h3>${esc(b.service)} · $${esc(b.price)}</h3><p><strong>${esc(b.start_time)}–${esc(b.end_time)}</strong> · ${esc(b.vehicle_type)}</p><p>${esc(b.name)} · ${esc(b.phone)} · ${esc(b.vehicle)}</p><p>${esc(b.notes||'No notes')}</p><p class="meta">ID: ${esc(b.id)} · Submitted ${esc(b.created_at)}</p></div><div><span class="status ${esc(b.status)}">${esc(b.status)}</span><div class="actions" style="margin-top:10px">${b.status==='pending'?'<button class="btn primary" data-action="confirmed">CONFIRM</button>':''}${b.status!=='cancelled'&&b.status!=='completed'?'<button class="btn" data-action="cancelled">CANCEL</button>':''}${b.status==='confirmed'?'<button class="btn" data-action="completed">COMPLETE</button>':''}</div></div></div>`;el.querySelectorAll('[data-action]').forEach(x=>x.onclick=()=>update(b.id,x.dataset.action));$('list').appendChild(el)})}
async function update(id,status){const r=await fetch('/api/admin',{method:'PATCH',headers:authHeaders(),body:JSON.stringify({id,status})});const d=await r.json();if(!r.ok)alert(d.error||'Update failed');else load()}
$('loginForm').onsubmit=async e=>{e.preventDefault();token=$('token').value.trim();sessionStorage.setItem('emerald_admin_token',token);$('loginError').style.display='none';await load();if(token&&$('list').innerHTML!==''||$('empty').style.display==='block'){$('login').classList.add('hidden');$('app').classList.remove('hidden')}};
$('refresh').onclick=load;$('date').onchange=load;$('logout').onclick=()=>{sessionStorage.removeItem('emerald_admin_token');location.reload()};if(token){$('login').classList.add('hidden');$('app').classList.remove('hidden');load()}
</script></body></html>
