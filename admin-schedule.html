<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Emerald Admin — Schedule</title><style>:root{--g:#00d94f;--b:#050606;--p:#0b0f0c;--l:#1e2922;--m:#8f9b93;--w:#f4f7f5;--r:#ff9d9d}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#0d1710,#050606 45%);color:var(--w);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Inter,system-ui,sans-serif}.wrap{width:min(760px,100%);margin:auto;padding:30px 18px 60px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:25px}.ey{font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--g);font-weight:900}.title{font-size:42px;line-height:.95;letter-spacing:-.045em;text-transform:uppercase;margin:7px 0}.title span{color:var(--g)}.panel{background:linear-gradient(180deg,#101611,#080a09);border:1px solid var(--l);border-radius:14px;padding:20px;margin-bottom:14px}.label{display:block;color:#758078;font-size:9px;text-transform:uppercase;letter-spacing:.1em;font-weight:900;margin-bottom:7px}.row{display:grid;grid-template-columns:1fr auto;gap:9px;align-items:end}.input,.btn{height:44px;border-radius:8px;font:inherit}.input{width:100%;background:#080c09;border:1px solid #29352e;color:var(--w);padding:10px 12px}.btn{border:1px solid #303c34;background:#090d0a;color:var(--w);padding:0 15px;font-size:10px;font-weight:900;letter-spacing:.04em;cursor:pointer}.btn.primary{background:var(--g);border-color:var(--g);color:#031007}.btn.danger{color:#ffb2b2;border-color:#5b2929}.hint{color:#69756d;font-size:11px;line-height:1.5;margin:9px 0 0}.item{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#090d0a;border:1px solid #28352c;border-radius:9px;padding:10px 11px;margin-top:8px}.date{font-weight:800;font-size:13px}.muted{color:var(--m);font-size:11px}.error{color:#ffaaaa;font-size:11px;line-height:1.4;margin-top:10px}.empty{color:var(--m);font-size:12px;padding:12px 0}.back{color:var(--g);font-size:10px;font-weight:900;text-decoration:none}@media(max-width:520px){.wrap{padding:22px 14px 45px}.row{grid-template-columns:1fr}.btn{width:100%}.item{align-items:flex-start;flex-direction:column}.item .btn{width:auto}}</style></head><body><main class="wrap"><header class="top"><div><div class="ey">Private dashboard</div><div class="title">Schedule<span>.</span></div></div><a class="back" href="admin.html">BACK TO BOOKINGS</a></header><section class="panel"><div class="ey">Availability</div><h2 style="margin:7px 0 14px;font-size:21px">Block a day</h2><div class="row"><div><label class="label" for="date">Date</label><input class="input" id="date" type="date"></div><button class="btn primary" id="block">BLOCK DAY</button></div><p class="hint">Blocking a date prevents new customer bookings. Existing bookings are not cancelled.</p><div id="error" class="error"></div></section><section class="panel"><div class="ey">Unavailable dates</div><div id="list"><div class="empty">Loading…</div></div></section></main><script>const token=sessionStorage.getItem('emerald_admin_key')||'';const $=id=>document.getElementById(id);const headers=()=>({Authorization:'Bearer '+token});const pretty=d=>new Date(d+'T12:00:00').toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric',year:'numeric'});function err(s=''){$('error').textContent=s}async function api(url,opt={}){const r=await fetch(url,{...opt,headers:{...headers(),...(opt.headers||{})},cache:'no-store'});let d={};try{d=await r.json()}catch{}if(r.status===401)throw new Error('Your admin session is invalid. Open Admin Bookings and log in again.');if(!r.ok)throw new Error(d.error||'Request failed.');return d}async function load(){if(!token){location.href='admin.html';return}try{const d=await api('/api/blocked-days');const xs=d.blockedDays||[];$('list').innerHTML=xs.length?xs.map(x=>`<div class="item"><div><div class="date">${pretty(x.service_date)}</div><div class="muted">${x.service_date}</div></div><button class="btn danger" data-date="${x.service_date}">UNBLOCK</button></div>`).join(''):'<div class="empty">No blocked days.</div>';document.querySelectorAll('[data-date]').forEach(b=>b.onclick=()=>remove(b.dataset.date,b))}catch(e){err(e.message)}}async function remove(date,btn){if(!confirm('Unblock '+pretty(date)+'?'))return;btn.disabled=true;try{await api('/api/blocked-days?date='+encodeURIComponent(date),{method:'DELETE'});await load()}catch(e){err(e.message);btn.disabled=false}}$('block').onclick=async()=>{const date=$('date').value;if(!date){err('Choose a date first.');return}err('');$('block').disabled=true;try{await api('/api/blocked-days',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({date})});$('date').value='';await load()}catch(e){err(e.message)}finally{$('block').disabled=false}};load();</script></body></html>
